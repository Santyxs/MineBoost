version: 2

command:
  no-permission: "&cYou don't have permission to use this command."
  reload-success: "&aMineBoost configuration reloaded."
  usage: "&eUsage: /mineboost give <pickaxe|shovel|axe> <wood|stone|copper|iron|gold|diamond|netherite> [player]"
  invalid-tool: "&cInvalid tool. Use: pickaxe, shovel or axe."
  invalid-material: "&cInvalid material. Use: wood, stone, copper, iron, gold, diamond or netherite."
  player-not-found: "&cPlayer not found: %player%"
  console-must-specify-player: "&cYou must specify a player from the console."
  target-no-permission: "&c%player% doesn't have permission to hold %tier% tools (%permission%)."
  received: "&aYou received: &r%tool%"
  given-to: "&a%tool% given to %player%"
  inventory-full-drop: "&eYour inventory was full, the tool was dropped on the ground."
  help:
    header: "&6&lMineBoost &7- Commands"
    give:
      usage: "/mineboost give <pickaxe|shovel|axe> <wood|stone|copper|iron|gold|diamond|netherite> [player]"
      description: "Gives a tool."
    reload:
      usage: "/mineboost reload"
      description: "Reloads config and the language files."
    info:
      usage: "/mineboost info <wood|stone|copper|iron|gold|diamond|netherite>"
      description: "Shows area size, cooldown and permission for a tier."
    help:
      usage: "/mineboost help"
      description: "Shows this command list."
  info:
    usage: "&eUsage: /mineboost info <wood|stone|copper|iron|gold|diamond|netherite>"
    header: "&6&lMineBoost &7- %tier% Info"
    area: "&7Area: &f%size%x%size% &7(%blocks% blocks)"
    cooldown: "&7Cooldown: &f%seconds%s"
    permission: "&7Permission: &f%permission%"
    has-permission: "&aYou have this permission."
    no-permission: "&cYou don't have this permission."

mine:
  cooldown: "&6⏳ x2 bonus on cooldown: %seconds%s"
  no-permission: "&c✖ You need the matching rank for the x2 bonus of %tier%."

recipe:
  no-permission: "&c✖ You don't have permission to craft %tier% tools."

toggle:
  enabled: "&a✔ x2 Mode &lENABLED"
  disabled: "&c✖ x2 Mode &lDISABLED"

family:
  pickaxe:
    label: "Pickaxe"
  shovel:
    label: "Shovel"
  axe:
    label: "Axe"

tier:
  wood: "Wood"
  stone: "Stone"
  copper: "Copper"
  iron: "Iron"
  gold: "Gold"
  diamond: "Diamond"
  netherite: "Netherite"

tool:
  displayname: "%tier% %family% x2"
  lore:
    area: "Breaks an area of &f%size%x%size%&7 (%blocks% blocks)"
    cooldown: "Cooldown: &f%seconds%s&7 between bonus uses."
    speed: "Speed:"
    durability: "Durability:"
    mode-on: "&a● x2 Mode: ENABLED"
    mode-off: "&c● x2 Mode: DISABLED"
    toggle-hint: "&8&o(Sneak + right-click to toggle)"